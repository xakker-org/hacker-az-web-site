services:
  db:
    image: postgres:16-alpine
    container_name: xakker_db
    environment:
      POSTGRES_DB: xakker_db
      POSTGRES_USER: xakker_user
      POSTGRES_PASSWORD: xakker_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xakker_user -d xakker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: xakker_backend
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: xakker_db
      POSTGRES_USER: xakker_user
      POSTGRES_PASSWORD: xakker_password
      ALLOWED_HOSTS: localhost,127.0.0.1,xakker.org,self-study.xakker.org
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000,http://xakker.org:8000,http://self-study.xakker.org:8000
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000,http://xakker.org:8000,http://self-study.xakker.org:8000
      DEBUG: "True"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: xakker_frontend
    profiles:
      - frontend-dev
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/react:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  pgdata:
