services:
  - type: web
    name: xakker-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerBuildTarget: backend
    dockerCommand: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: xakker-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "xakker-platform.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: xakker-db
    databaseName: xakker_db
    user: xakker_user
    plan: free
